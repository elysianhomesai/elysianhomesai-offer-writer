<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elysian Offer Writer</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><header><div class="brand">ELYSIAN <span>HOMES</span></div><div class="sub">Purchase Offer Writer</div></header>
<main><section class="card" id="intake"><div class="eyebrow">NEW OFFER</div><h1>Prepare a Purchase Offer</h1><p class="lead">Give us the basics. We'll organize the offer and tell you exactly what's still needed.</p>
<form id="form"><label>MLS Number <b>*</b><input id="mls" required placeholder="R1717139"></label><label>Buyer(s) <b>*</b><input id="buyers" required placeholder="John Smith and Jane Smith"></label><label>Tell us about the offer <b>*</b><textarea id="offer" required rows="6" placeholder="$425k conventional, 20% down, $10k deposit, inspection within 5 days, close 2026-11-20, $5k seller concession, escalate by $2k to $440k."></textarea></label><button>Prepare Offer <span>→</span></button></form></section>
<section class="card hidden" id="review"><div class="row"><div><div class="eyebrow">OFFER REVIEW</div><h1 id="reviewTitle">Offer Details</h1></div><button class="secondary" id="edit">← Edit</button></div><div id="status"></div><div id="checks"></div><div class="notice">V1 intake only — nothing is sent to TransactionDesk and no contract is created.</div></section></main><script src="/static/app.js"></script></body></html>
